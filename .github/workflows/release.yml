# Tag a reviewed commit v<version> to publish a Release with the zipped app.
# The build is ad-hoc signed — no Apple Developer identity, no notarization.
# Gatekeeper asks first-time users to right-click → Open; see docs/RELEASING.md.
name: release
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Perch requires the macOS 26 SDK (Liquid Glass). The runner's default
      # Xcode predates it; select 26 explicitly.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"
      - name: Build release artifact
        run: ./scripts/build-release.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          shopt -s nullglob
          artifacts=(build/release/Perch-*.zip build/release/Perch-*.zip.sha256)
          [ ${#artifacts[@]} -gt 0 ]
          gh release create "$tag" "${artifacts[@]}" \
            --title "Perch $tag" \
            --notes-file docs/release-notes/${tag}.md 2>/dev/null \
            || gh release create "$tag" "${artifacts[@]}" --title "Perch $tag" --generate-notes
