name: Functional checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functional-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Bridge and acceptance contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # Version checks and build stamps need tags and full history.
          fetch-depth: 0
      - run: python3 scripts/check-functional.py portable --output .local/functional-portable
      - name: Retain check results and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-results
          path: .local/functional-portable/
          include-hidden-files: true
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  native-build:
    name: Native build and package
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Restore Swift package dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build/checkouts
            .build/artifacts
            Resources/Mermaid/mermaid.min.js
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-27-deps-v2-${{ hashFiles('Package.resolved', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-27-deps-${{ hashFiles('Package.resolved', 'patches/**') }}
            ${{ runner.os }}-${{ runner.arch }}-xcode-27-spm-${{ hashFiles('Package.resolved') }}
      - name: Restore incremental SwiftPM release build
        uses: actions/cache@v4
        with:
          path: |
            .build/arm64-apple-macosx
            .build/build.db
            .build/workspace-state.json
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-27-release-${{ hashFiles('Package.resolved', 'patches/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-27-release-${{ hashFiles('Package.resolved', 'patches/**') }}-
      - run: python3 scripts/check-functional.py macos --group build --output .local/functional-build
      - name: Package the shared native build
        run: |
          set -o pipefail
          mkdir -p .local/native-build
          resources=()
          for path in Resources/Highlight/highlight.min.js Resources/Mermaid/mermaid.min.js; do
            if [ -f "$path" ]; then resources+=("$path"); fi
          done
          if command -v zstd >/dev/null 2>&1; then
            tar -cf - .build build/Perch.app "${resources[@]}" | zstd -1 -T0 -f -q -o .local/native-build/build.tar.zst
          else
            tar -czf .local/native-build/build.tar.gz .build build/Perch.app "${resources[@]}"
          fi
      - name: Publish the shared native build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-build-${{ github.sha }}
          path: .local/native-build/build.tar.*
          compression-level: 0
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      - name: Retain build results
        if: always() && hashFiles('.local/functional-build/results.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-results-native-build
          path: .local/functional-build/
          include-hidden-files: true
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  native-core:
    name: Native core interaction regression
    needs: native-build
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download the shared native build
        uses: actions/download-artifact@v4
        with:
          name: native-build-${{ github.sha }}
          path: .local/native-build
      - name: Restore the shared native build
        run: |
          set -o pipefail
          if [ -f .local/native-build/build.tar.zst ]; then
            zstd -d -T0 -q -c .local/native-build/build.tar.zst | tar -xf -
          else
            tar -xzf .local/native-build/build.tar.gz
          fi
      - env:
          PERCH_REUSE_PREBUILT: '1'
        run: python3 scripts/check-functional.py macos --group core-regression --output .local/functional-core
      - name: Retain core results
        if: always() && hashFiles('.local/functional-core/results.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-results-native-core
          path: .local/functional-core/
          include-hidden-files: true
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  native-math:
    name: Native math performance regression
    needs: native-build
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download the shared native build
        uses: actions/download-artifact@v4
        with:
          name: native-build-${{ github.sha }}
          path: .local/native-build
      - name: Restore the shared native build
        run: |
          set -o pipefail
          if [ -f .local/native-build/build.tar.zst ]; then
            zstd -d -T0 -q -c .local/native-build/build.tar.zst | tar -xf -
          else
            tar -xzf .local/native-build/build.tar.gz
          fi
      - env:
          PERCH_REUSE_PREBUILT: '1'
        run: python3 scripts/check-functional.py macos --group core-math --output .local/functional-math
      - name: Retain math performance results
        if: always() && hashFiles('.local/functional-math/results.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-results-native-math
          path: .local/functional-math/
          include-hidden-files: true
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  native-host-build:
    name: Native host fixture build
    needs: native-build
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download the shared native build
        uses: actions/download-artifact@v4
        with:
          name: native-build-${{ github.sha }}
          path: .local/native-build
      - name: Restore the shared native build
        run: |
          set -o pipefail
          if [ -f .local/native-build/build.tar.zst ]; then
            zstd -d -T0 -q -c .local/native-build/build.tar.zst | tar -xf -
          else
            tar -xzf .local/native-build/build.tar.gz
          fi
      - run: python3 scripts/check-functional.py macos --group host-build --output .local/functional-host-build
      - name: Package the host lifecycle fixture
        run: |
          mkdir -p .local/host-fixture
          ditto -c -k --sequesterRsrc --keepParent .local/host-fixture/HostLifecycleChecks.app .local/host-fixture/HostLifecycleChecks.zip
      - name: Publish the host lifecycle fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-host-fixture-${{ github.sha }}
          path: .local/host-fixture/HostLifecycleChecks.zip
          compression-level: 0
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      - name: Retain host fixture build results
        if: always() && hashFiles('.local/functional-host-build/results.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-results-native-host-build
          path: .local/functional-host-build/
          include-hidden-files: true
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  native-host:
    name: Native host lifecycle regression (${{ matrix.group }})
    needs: native-host-build
    strategy:
      fail-fast: false
      matrix:
        group: [state, workspace]
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download the host lifecycle fixture
        uses: actions/download-artifact@v4
        with:
          name: native-host-fixture-${{ github.sha }}
          path: .local/host-fixture-archive
      - name: Restore the host lifecycle fixture
        run: |
          mkdir -p .local/host-fixture
          ditto -x -k .local/host-fixture-archive/HostLifecycleChecks.zip .local/host-fixture
      - run: python3 scripts/check-functional.py macos --group host-${{ matrix.group }} --output .local/functional-host-${{ matrix.group }}
      - name: Retain host lifecycle results
        if: always() && hashFiles(format('.local/functional-host-{0}/results.json', matrix.group)) != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-results-native-host-${{ matrix.group }}
          path: .local/functional-host-${{ matrix.group }}/
          include-hidden-files: true
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  native-acceptance-build:
    name: Native acceptance fixture build
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore Swift package dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build/checkouts
            .build/artifacts
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-27-deps-v2-${{ hashFiles('Package.resolved', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-27-deps-${{ hashFiles('Package.resolved', 'patches/**') }}
            ${{ runner.os }}-${{ runner.arch }}-xcode-27-spm-${{ hashFiles('Package.resolved') }}
      - name: Restore incremental acceptance build
        uses: actions/cache@v4
        with:
          path: |
            .build/arm64-apple-macosx
            .build/build.db
            .build/workspace-state.json
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-27-acceptance-${{ hashFiles('Package.resolved', 'patches/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-27-acceptance-${{ hashFiles('Package.resolved', 'patches/**') }}-
      - run: python3 scripts/check-functional.py macos --group native-build --output .local/functional-native-build
      - name: Package the native acceptance fixture
        run: |
          mkdir -p .local/native-acceptance
          ditto -c -k --sequesterRsrc --keepParent "build/Perch Acceptance.app" .local/native-acceptance/PerchAcceptance.zip
      - name: Publish the native acceptance fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-acceptance-${{ github.sha }}
          path: .local/native-acceptance/PerchAcceptance.zip
          compression-level: 0
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      - name: Retain native acceptance build results
        if: always() && hashFiles('.local/functional-native-build/results.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-results-native-acceptance-build
          path: .local/functional-native-build/
          include-hidden-files: true
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  native-acceptance:
    name: Native session regression (${{ matrix.group }})
    needs: native-acceptance-build
    strategy:
      fail-fast: false
      matrix:
        group: [streaming, session]
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download the native acceptance fixture
        uses: actions/download-artifact@v4
        with:
          name: native-acceptance-${{ github.sha }}
          path: .local/native-acceptance
      - name: Restore the native acceptance fixture
        run: |
          mkdir -p build
          ditto -x -k .local/native-acceptance/PerchAcceptance.zip build
      - run: python3 scripts/check-functional.py macos --group native-${{ matrix.group }} --output .local/functional-native-${{ matrix.group }}
      - name: Retain native session results
        if: always() && hashFiles(format('.local/functional-native-{0}/results.json', matrix.group)) != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-results-native-acceptance-${{ matrix.group }}
          path: .local/functional-native-${{ matrix.group }}/
          include-hidden-files: true
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  native-navigation:
    name: Native navigation regression
    needs: native-build
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download the shared native build
        uses: actions/download-artifact@v4
        with:
          name: native-build-${{ github.sha }}
          path: .local/native-build
      - name: Restore the shared native build
        run: |
          set -o pipefail
          if [ -f .local/native-build/build.tar.zst ]; then
            zstd -d -T0 -q -c .local/native-build/build.tar.zst | tar -xf -
          else
            tar -xzf .local/native-build/build.tar.gz
          fi
      - env:
          PERCH_REUSE_PREBUILT: '1'
        run: python3 scripts/check-functional.py macos --group navigation --output .local/functional-navigation
      - name: Retain navigation results
        if: always() && hashFiles('.local/functional-navigation/results.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-results-native-navigation
          path: .local/functional-navigation/
          include-hidden-files: true
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  native-summary:
    name: Native build and interaction regression
    if: always()
    needs:
      - native-build
      - native-core
      - native-math
      - native-host-build
      - native-host
      - native-acceptance-build
      - native-acceptance
      - native-navigation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Collect native regression evidence
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: macos-results-*
          path: .local/functional-groups
      - name: Verify every native group
        if: always()
        env:
          BUILD_RESULT: ${{ needs.native-build.result }}
          CORE_RESULT: ${{ needs.native-core.result }}
          MATH_RESULT: ${{ needs.native-math.result }}
          HOST_BUILD_RESULT: ${{ needs.native-host-build.result }}
          HOST_RESULT: ${{ needs.native-host.result }}
          ACCEPTANCE_BUILD_RESULT: ${{ needs.native-acceptance-build.result }}
          ACCEPTANCE_RESULT: ${{ needs.native-acceptance.result }}
          NAVIGATION_RESULT: ${{ needs.native-navigation.result }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = {
              "build": os.environ["BUILD_RESULT"],
              "core": os.environ["CORE_RESULT"],
              "math": os.environ["MATH_RESULT"],
              "host_build": os.environ["HOST_BUILD_RESULT"],
              "host": os.environ["HOST_RESULT"],
              "acceptance_build": os.environ["ACCEPTANCE_BUILD_RESULT"],
              "acceptance": os.environ["ACCEPTANCE_RESULT"],
              "navigation": os.environ["NAVIGATION_RESULT"],
          }
          print(json.dumps(results, indent=2))
          failed = {name: result for name, result in results.items() if result != "success"}
          if failed:
              raise SystemExit("Native regression groups did not all succeed: " + json.dumps(failed))
          PY
      - name: Publish combined native regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-results
          path: .local/functional-groups/
          include-hidden-files: true
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
