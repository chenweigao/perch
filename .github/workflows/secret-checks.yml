name: Secret checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets and publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned scanner
        run: python3 scripts/setup-security.py --tools-only
      - name: Verify security checks
        run: python3 -m unittest discover -s Tests/Publication -p 'test_*.py'
      - name: Scan complete reachable history
        run: python3 scripts/security-check.py history HEAD
